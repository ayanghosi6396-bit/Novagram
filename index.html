
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novagram</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#260044,#7025b9,#a66aff);color:white;font-family:Arial,sans-serif;min-height:100vh;padding:15px}
.container{max-width:500px;margin:20px auto;background:#321052;padding:20px;border-radius:20px;box-shadow:0 8px 30px #16002588}
h1,h2{text-align:center}
.small{text-align:center;color:#e5caff;font-size:14px}
input,textarea{width:100%;padding:13px;margin:7px 0;border:0;border-radius:9px;font-size:15px}
textarea{min-height:75px;resize:vertical}
button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:9px;background:#bd83ff;color:#260044;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
.post{background:#4b2170;padding:15px;margin:12px 0;border-radius:12px;overflow-wrap:anywhere}
.post small{color:#e5caff}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.comment{background:#321052;padding:9px;margin:7px 0;border-radius:8px}
.hidden{display:none}
hr{border:0;border-top:1px solid #8050a0;margin:18px 0}
</style>
</head>
<body>
<div class="container">
<h1>💜 Novagram</h1>
<p class="small">Connect • Share • Discover</p>

<div id="auth">
<h2>स्वागत है!</h2>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button id="signup">नया अकाउंट बनाएँ</button>
<button id="login">लॉगिन करें</button>
<p id="message" class="small"></p>
</div>

<div id="app" class="hidden">
<h2>आपकी प्रोफाइल</h2>
<input id="name" placeholder="आपका नाम">
<input id="username" placeholder="Username">
<textarea id="bio" placeholder="अपने बारे में लिखें"></textarea>
<button id="saveProfile">प्रोफाइल सेव करें</button>
<button id="logout">लॉगआउट</button>
<p id="profileMessage" class="small"></p>

<hr>
<h2>पोस्ट बनाएँ</h2>
<textarea id="postText" placeholder="आपके मन में क्या है?"></textarea>
<button id="publish">पोस्ट प्रकाशित करें</button>
<p id="postMessage" class="small"></p>

<hr>
<h2>💜 Novagram Feed</h2>
<div id="feed">पोस्ट लोड हो रही हैं...</div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
 getFirestore,doc,setDoc,getDoc,collection,
 addDoc,onSnapshot,updateDoc,arrayUnion,arrayRemove,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCC5J21io0PaOrOhVeoR9L92ostWLKI4GE",
 authDomain:"novagram-68bd9.firebaseapp.com",
 projectId:"novagram-68bd9",
 storageBucket:"novagram-68bd9.firebasestorage.app",
 messagingSenderId:"712062216370",
 appId:"1:712062216370:web:c8325500a538873af8c1ab",
 measurementId:"G-WV2MCHK3HS"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
let currentUser=null;
let stopFeed=null;

function message(id,text){
 $(id).textContent=text;
}

$("signup").onclick=async()=>{
 try{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||password.length<6){
   message("message","ईमेल और कम से कम 6 अक्षर का पासवर्ड डालें।");
   return;
  }
  await createUserWithEmailAndPassword(auth,email,password);
  message("message","अकाउंट बन गया!");
 }catch(e){message("message",e.message);}
};

$("login").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
 }catch(e){message("message",e.message);}
};

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 $("auth").classList.toggle("hidden",!!user);
 $("app").classList.toggle("hidden",!user);

 if(stopFeed){stopFeed();stopFeed=null;}

 if(user){
  try{
   const ref=doc(db,"Users",user.uid);
   const snap=await getDoc(ref);
   if(snap.exists()){
    const data=snap.data();
    $("name").value=data.name||"";
    $("username").value=data.username||"";
    $("bio").value=data.bio||"";
   }
   loadFeed();
  }catch(e){
   message("profileMessage",e.message);
  }
 }
});

$("saveProfile").onclick=async()=>{
 if(!currentUser)return;
 try{
  await setDoc(doc(db,"Users",currentUser.uid),{
   name:$("name").value.trim(),
   username:$("username").value.trim(),
   bio:$("bio").value.trim(),
   email:currentUser.email
  },{merge:true});
  message("profileMessage","प्रोफाइल सेव हो गई! 💜");
 }catch(e){message("profileMessage",e.message);}
};

$("logout").onclick=async()=>{
 try{await signOut(auth);}
 catch(e){message("profileMessage",e.message);}
};

$("publish").onclick=async()=>{
 if(!currentUser)return;
 const text=$("postText").value.trim();
 if(!text){
  message("postMessage","पहले कुछ लिखें।");
  return;
 }
 try{
  await addDoc(collection(db,"Posts"),{
   uid:currentUser.uid,
   name:$("name").value.trim()||"Novagram User",
   username:$("username").value.trim()||"user",
   text:text,
   likes:[],
   comments:[],
   createdAt:serverTimestamp()
  });
  $("postText").value="";
  message("postMessage","पोस्ट प्रकाशित हो गई! 💜");
 }catch(e){message("postMessage",e.message);}
};

function loadFeed(){
 const feedRef=collection(db,"Posts");
 stopFeed=onSnapshot(feedRef,snapshot=>{
  const posts=snapshot.docs.map(d=>({id:d.id,...d.data()}));
  posts.sort((a,b)=>{
   const at=a.createdAt?.toMillis?.()||0;
   const bt=b.createdAt?.toMillis?.()||0;
   return bt-at;
  });
  renderFeed(posts);
 },error=>{
  $("feed").textContent="Feed error: "+error.message;
 });
}

function renderFeed(posts){
 const feed=$("feed");
 feed.innerHTML="";

 if(posts.length===0){
  feed.textContent="अभी कोई पोस्ट नहीं है। पहली पोस्ट आप करें! 💜";
  return;
 }

 posts.forEach(post=>{
  const card=document.createElement("div");
  card.className="post";

  const heading=document.createElement("b");
  heading.textContent="💜 "+(post.name||post.username||"Novagram User");

  const content=document.createElement("p");
  content.style.whiteSpace="pre-wrap";
  content.textContent=post.text||post.content||post.postText||"";

  const info=document.createElement("small");
  info.textContent=post.createdAt?.toDate
   ?post.createdAt.toDate().toLocaleString("hi-IN")
   :"Novagram";

  const actions=document.createElement("div");
  actions.className="actions";

  const likes=Array.isArray(post.likes)?post.likes:[];
  const liked=likes.includes(currentUser.uid);

  const likeBtn=document.createElement("button");
  likeBtn.textContent=(liked?"❤️":"🤍")+" Like ("+likes.length+")";
  likeBtn.onclick=async()=>{
   try{
    const ref=doc(db,"Posts",post.id);
    await updateDoc(ref,{
     likes:liked
      ?arrayRemove(currentUser.uid)
      :arrayUnion(currentUser.uid)
    });
   }catch(e){alert("Like error: "+e.message);}
  };

  const commentBtn=document.createElement("button");
  commentBtn.textContent="💬 Comments";
  actions.append(likeBtn,commentBtn);

  const commentsBox=document.createElement("div");
  const comments=Array.isArray(post.comments)?post.comments:[];
  comments.forEach(c=>{
   const item=document.createElement("div");
   item.className="comment";
   item.textContent=(c.name||"User")+": "+(c.text||"");
   commentsBox.appendChild(item);
  });

  const commentInput=document.createElement("input");
  commentInput.placeholder="अपनी टिप्पणी लिखें...";

  const sendBtn=document.createElement("button");
  sendBtn.textContent="टिप्पणी भेजें";
  sendBtn.onclick=async()=>{
   const text=commentInput.value.trim();
   if(!text)return;
   try{
    await updateDoc(doc(db,"Posts",post.id),{
     comments:arrayUnion({
      uid:currentUser.uid,
      name:$("name").value.trim()||"Novagram User",
      text:text
     })
    });
   }catch(e){alert("Comment error: "+e.message);}
  };

  commentBtn.onclick=()=>{
   commentsBox.classList.toggle("hidden");
   commentInput.classList.toggle("hidden");
   sendBtn.classList.toggle("hidden");
  };

  commentInput.classList.add("hidden");
  sendBtn.classList.add("hidden");

  card.append(heading,info,content,actions,commentsBox,commentInput,sendBtn);
  feed.appendChild(card);
 });
}
</script>
</body>
</html>
