
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novagram 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0ff;font-family:Arial;color:#24143b}
header{background:linear-gradient(120deg,#4c1d95,#9333ea);color:white;padding:20px;text-align:center}
main{max-width:650px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:15px;box-shadow:0 3px 12px #0001}
h1,h2{margin-top:0}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
textarea{min-height:75px}
button{padding:11px 16px;background:#7025c9;color:white;border:0;border-radius:9px;font-weight:bold;margin:4px;cursor:pointer}
.secondary{background:#eee5ff;color:#54208c}
.hidden{display:none}
.post{border-bottom:1px solid #eee;padding:12px 0}
.post img{width:100%;max-height:400px;object-fit:contain}
.status{font-size:13px;color:#7025c9}
</style>
</head>
<body>
<header>
<h1>💜 Novagram</h1>
Connect • Share • Discover
</header>
<main>
<section id="auth" class="card">
<h2>Welcome to Novagram</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="signup">Sign Up</button>
<button id="login" class="secondary">Login</button>
<p id="authMsg" class="status"></p>
</section>

<div id="appArea" class="hidden">
<section class="card">
<h2>Your Profile</h2>
<input id="name" placeholder="Your Name">
<input id="username" placeholder="Username">
<textarea id="bio" placeholder="Write your Bio"></textarea>
<button id="saveProfile">Save Profile</button>
<button id="logout" class="secondary">Logout</button>
<p id="profileMsg" class="status"></p>
</section>

<section class="card">
<h2>Create Post</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<input id="photo" type="file" accept="image/*">
<button id="publish">Publish Post</button>
<p id="postMsg" class="status"></p>
</section>

<section class="card">
<h2>💜 Novagram Feed</h2>
<div id="feed">Loading posts...</div>
</section>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,addDoc,collection,query,orderBy,onSnapshot,serverTimestamp,deleteDoc,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyCC5J21io0PaOrOhVeoR9L92ostWLKI4GE",
authDomain:"novagram-68bd9.firebaseapp.com",
projectId:"novagram-68bd9",
storageBucket:"novagram-68bd9.firebasestorage.app",
messagingSenderId:"712062216370",
appId:"1:712062216370:web:c8325500a538873af8c1ab"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);
const $=id=>document.getElementById(id);
let user=null,profile={name:"Novagram User",username:"user",bio:""};
let stopFeed=null;

function msg(id,text){$(id).textContent=text}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function error(e){return e.code==="auth/email-already-in-use"?"Email already registered":e.code==="auth/invalid-credential"?"Email or password incorrect":e.message}

$("signup").onclick=async()=>{
try{
await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
msg("authMsg","Account created!");
}catch(e){msg("authMsg",error(e))}
};

$("login").onclick=async()=>{
try{
await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
msg("authMsg","Login successful!");
}catch(e){msg("authMsg",error(e))}
};

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
user=u;
$("auth").classList.toggle("hidden",!!u);
$("appArea").classList.toggle("hidden",!u);
if(!u){if(stopFeed)stopFeed();return}
await loadProfile();
startFeed();
});

async function loadProfile(){
let s=await getDoc(doc(db,"Users",user.uid));
if(s.exists())profile={...profile,...s.data()};
else await setDoc(doc(db,"Users",user.uid),profile);
$("name").value=profile.name||"";
$("username").value=profile.username||"";
$("bio").value=profile.bio||"";
}

$("saveProfile").onclick=async()=>{
try{
profile={name:$("name").value.trim(),username:$("username").value.trim(),bio:$("bio").value.trim()};
await setDoc(doc(db,"Users",user.uid),profile,{merge:true});
msg("profileMsg","Profile saved 💜");
}catch(e){msg("profileMsg",error(e))}
};

$("publish").onclick=async()=>{
let text=$("postText").value.trim(),file=$("photo").files[0];
if(!text&&!file){msg("postMsg","Write something or select a photo.");return}
if(file&&(!file.type.startsWith("image/")||file.size>5*1024*1024)){msg("postMsg","Choose an image under 5 MB.");return}
try{
let imageUrl="";
if(file){
let r=ref(storage,"posts/"+user.uid+"/"+Date.now()+"_"+file.name);
await uploadBytes(r,file);
imageUrl=await getDownloadURL(r);
}
await addDoc(collection(db,"Posts"),{
uid:user.uid,name:profile.name||"Novagram User",
username:profile.username||"user",text,imageUrl,
createdAt:serverTimestamp()
});
$("postText").value="";
$("photo").value="";
msg("postMsg","Post published! 💜");
}catch(e){msg("postMsg",error(e))}
};

function startFeed(){
if(stopFeed)stopFeed();
stopFeed=onSnapshot(query(collection(db,"Posts"),orderBy("createdAt","desc")),s=>{
$("feed").innerHTML="";
if(s.empty){$("feed").textContent="No posts yet. Welcome to Novagram!";return}
s.forEach(p=>{
let d=p.data(),id=p.id,el=document.createElement("div");
el.className="post";
el.innerHTML=`<b>💜 ${safe(d.name)}</b><p>@${safe(d.username)}</p><p>${safe(d.text)}</p>${d.imageUrl?`<img src="${safe(d.imageUrl)}">`:""}<button class="secondary like">🤍 Like</button><span class="likes">Loading...</span><button class="secondary toggle">💬 Comments</button><div class="comments hidden"><div class="commentList"></div><input class="commentText" placeholder="Write a comment..."><button class="send">Send</button></div>`;
$("feed").appendChild(el);
const likeRef=doc(db,"Posts",id,"Likes",user.uid);
const likes=collection(db,"Posts",id,"Likes");
async function refresh(){
try{
let [mine,all]=await Promise.all([getDoc(likeRef),getDocs(likes)]);
el.querySelector(".like").textContent=mine.exists()?"💜 Liked":"🤍 Like";
el.querySelector(".likes").textContent=" "+all.size+" Likes";
}catch(e){el.querySelector(".likes").textContent="Likes unavailable"}
}
el.querySelector(".like").onclick=async()=>{
try{
let mine=await getDoc(likeRef);
if(mine.exists())await deleteDoc(likeRef);
else await setDoc(likeRef,{uid:user.uid});
await refresh();
}catch(e){alert(error(e))}
};
refresh();

const box=el.querySelector(".comments"),list=el.querySelector(".commentList");
async function loadComments(){
try{
let cs=await getDocs(query(collection(db,"Posts",id,"Comments"),orderBy("createdAt","asc")));
list.innerHTML="";
cs.forEach(c=>{
let x=document.createElement("p");
x.innerHTML="<b>"+safe(c.data().name)+"</b>: "+safe(c.data().text);
list.appendChild(x);
});
}catch(e){list.textContent="Comments unavailable"}
}
el.querySelector(".toggle").onclick=()=>{box.classList.toggle("hidden");loadComments()};
el.querySelector(".send").onclick=async()=>{
let input=el.querySelector(".commentText"),t=input.value.trim();
if(!t)return;
try{
await addDoc(collection(db,"Posts",id,"Comments"),{uid:user.uid,name:profile.name||"User",text:t,createdAt:serverTimestamp()});
input.value="";
loadComments();
}catch(e){alert(error(e))}
};
});
},e=>{$("feed").textContent=error(e)});
}
</script>
</body>
</html>
