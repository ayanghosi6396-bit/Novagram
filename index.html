<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novagram</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5ff;font-family:Arial;color:#24143d}
header{background:#7136c9;color:white;padding:20px;font-size:27px;font-weight:bold}
nav{display:flex;justify-content:space-around;background:white;padding:15px;position:sticky;top:0}
button{border:0;border-radius:20px;padding:11px 17px;background:#7136c9;color:white;font-weight:bold}
.stories{display:flex;gap:15px;padding:18px;overflow:auto;background:white}
.story{text-align:center;min-width:65px;font-size:12px}
.circle{width:58px;height:58px;border-radius:50%;background:#d9baff;border:3px solid #7136c9;margin:auto auto 6px}
.card{background:white;margin:15px;border-radius:15px;padding:15px}
.user{font-weight:bold;margin-bottom:12px}
.photo{width:100%;height:230px;object-fit:cover;border-radius:10px;background:#e9ddff}
.actions{display:flex;gap:15px;padding:12px 0}
#upload{display:none}
footer{position:fixed;bottom:0;background:white;width:100%;display:flex;justify-content:space-around;padding:15px}
footer button{background:white;color:#7136c9;font-size:20px}
</style>
</head>
<body>
<header>💜 Novagram</header>
<nav>
<span>Home</span><span>Explore</span><span>Messages</span>
</nav>

<div class="stories">
<div class="story"><div class="circle">➕</div>Your story</div>
<div class="story"><div class="circle"></div>Friends</div>
<div class="story"><div class="circle"></div>Creator</div>
<div class="story"><div class="circle"></div>Popular</div>
</div>

<div class="card">
<h3>Create a post</h3>
<p>Share your photos and videos on Novagram.</p>
<label for="upload"><button>＋ Upload Photo / Video</button></label>
<input id="upload" type="file" accept="image/*,video/*">
<div id="preview"></div>
</div><button id="postBtn" style="margin-top:15px;width:100%">
📤 Post Now
</button>

<div class="card">
<div class="user">💜 Novagram Community</div>
<div class="photo"></div>
<div class="actions">
<span>♡ Like</span><span>💬 Comment</span><span>↗ Share</span>
</div>
<p>Welcome to Novagram! 💜</p>
</div>

<footer>
<button>⌂</button>
<button>🔍</button>
<button onclick="document.getElementById('upload').click()">＋</button>
<button>♡</button>
<button>👤</button>
</footer>

<script>
document.getElementById('upload').onchange=function(){
const file=this.files[0];
if(!file)return;
const url=URL.createObjectURL(file);
const el=document.createElement(file.type.startsWith('video/')?'video':'img');
el.src=url;
el.controls=true;
el.style.width='100%';
el.style.marginTop='15px';
document.getElementById('preview').replaceChildren(el);
};
</script>
</body>
</html>
