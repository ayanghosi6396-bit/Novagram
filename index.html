

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novagram</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#260044,#7025b9,#a66aff);
 color:white;
 min-height:100vh;
 padding:20px;
}
.container{
 max-width:430px;
 margin:35px auto;
 background:#321052;
 padding:25px;
 border-radius:20px;
 box-shadow:0 8px 30px #16002588;
}
h1{text-align:center;color:#e5baff}
h2{text-align:center}
input,textarea{
 width:100%;
 padding:13px;
 margin:8px 0;
 border:0;
 border-radius:9px;
 background:#f5eaff;
 font-size:15px;
}
button{
 width:100%;
 padding:13px;
 margin:7px 0;
 border:0;
 border-radius:9px;
 background:#bd83ff;
 color:#260044;
 font-size:16px;
 font-weight:bold;
}
button:active{opacity:.8}
.small{
 text-align:center;
 font-size:14px;
 color:#e5caff;
}
.hidden{display:none}
.post{
 background:#4b2170;
 padding:15px;
 margin:12px 0;
 border-radius:12px;
 overflow-wrap:anywhere;
}
</style>
</head>
<body>

<div class="container">
<h1>💜 Novagram</h1>
<p class="small">Connect • Share • Discover</p>

<div id="auth">
<h2>Welcome</h2>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button id="signup">Create Account</button>
<button id="login">Login</button>
<p id="message" class="small"></p>
</div>

<div id="profile" class="hidden">
<h2>Your Profile</h2>
<input id="name" placeholder="Your Name">
<input id="username" placeholder="Username">
<textarea id="bio" placeholder="Write your Bio"></textarea>
<button id="saveProfile">Save Profile</button>
<button id="logout">Logout</button>
<p id="profileMessage" class="small"></p>

<hr>
<h2>Create Post</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<button id="publish">Publish Post</button>
<p id="postMessage" class="small"></p>
<h2>Novagram Feed</h2>
<div id="feed"></div>
</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
 getFirestore,doc,setDoc,getDoc,
 collection,addDoc,onSnapshot,query,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyCC5J21io0PaOrOhVeoR9L92ostWLKI4GE",
 authDomain:"novagram-68bd9.firebaseapp.com",
 projectId:"novagram-68bd9",
 storageBucket:"novagram-68bd9.firebasestorage.app",
 messagingSenderId:"712062216370",
 appId:"1:712062216370:web:c8325500a538873af8c1ab",
 measurementId:"G-WV2MCHK3HS"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

$("signup").onclick=async()=>{
 try{
  await createUserWithEmailAndPassword(
   auth,$("email").value,$("password").value
  );
  $("message").textContent="Account created!";
 }catch(e){$("message").textContent=e.message}
};

$("login").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,$("email").value,$("password").value
  );
 }catch(e){$("message").textContent=e.message}
};

onAuthStateChanged(auth,async user=>{
 $("auth").classList.toggle("hidden",!!user);
 $("profile").classList.toggle("hidden",!user);
 if(!user)return;

 try{
  const ref=doc(db,"Users",user.uid);
  const snap=await getDoc(ref);
  if(snap.exists()){
   const d=snap.data();
   $("name").value=d.Name||"";
   $("username").value=d.username||"";
   $("bio").value=d.Bio||"";
  }
  loadFeed();
 }catch(e){
  $("profileMessage").textContent="Database access error: "+e.message;
 }
});

$("saveProfile").onclick=async()=>{
 const user=auth.currentUser;
 if(!user)return;
 try{
  await setDoc(doc(db,"Users",user.uid),{
   Name:$("name").value.trim(),
   username:$("username").value.trim(),
   Bio:$("bio").value.trim(),
   email:user.email,
   createdAt:serverTimestamp()
  },{merge:true});
  $("profileMessage").textContent="Profile saved!";
 }catch(e){$("profileMessage").textContent=e.message}
};

$("publish").onclick=async()=>{
 const user=auth.currentUser;
 const content=$("postText").value.trim();
 if(!user||!content)return;
 try{
  await addDoc(collection(db,"Posts"),{
   text:content,
   uid:user.uid,
   email:user.email,
   createdAt:serverTimestamp()
  });
  $("postText").value="";
  $("postMessage").textContent="Post published!";
 }catch(e){$("postMessage").textContent=e.message}
};

let unsubscribe=null;
function loadFeed(){
 if(unsubscribe)unsubscribe();
 const q=query(collection(db,"Posts"),orderBy("createdAt","desc"));
 unsubscribe=onSnapshot(q,snapshot=>{
  $("feed").innerHTML="";
  snapshot.forEach(item=>{
   const d=item.data();
   const post=document.createElement("div");
   post.className="post";
   post.textContent=d.text||"";
   $("feed").appendChild(post);
  });
 },error=>{
  $("postMessage").textContent=error.message;
 });
}

$("logout").onclick=()=>signOut(auth);
</script>
</body>
</html>
