
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novagram</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#10091c;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:75px;
}
header{
 background:#1b102c;
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #49216c;
}
.logo{font-size:27px;font-weight:bold;color:#c084fc}
button{
 background:#8b35d1;
 color:white;
 border:0;
 padding:11px 16px;
 border-radius:9px;
 cursor:pointer;
}
.container{max-width:600px;margin:auto;padding:15px}
h2{color:#d7a5ff;margin-bottom:15px}
.stories{
 display:flex;gap:14px;overflow-x:auto;
 padding:12px 0 20px;
}
.story{
 min-width:62px;text-align:center;font-size:12px;
}
.circle{
 width:58px;height:58px;border-radius:50%;
 background:linear-gradient(45deg,#8b35d1,#ed70ff);
 padding:3px;margin-bottom:5px;
}
.circle div{
 background:#211333;border-radius:50%;
 width:100%;height:100%;
 display:grid;place-items:center;font-size:22px;
}
.card{
 background:#21152f;
 border:1px solid #49216c;
 border-radius:14px;
 padding:14px;
 margin-bottom:17px;
}
input,textarea{
 width:100%;padding:12px;
 border-radius:8px;border:1px solid #7541a0;
 background:#160d24;color:white;margin:8px 0;
}
.post-media{
 width:100%;max-height:420px;
 object-fit:contain;border-radius:10px;
 margin-top:12px;
 background:#10091c;
}
.actions{
 display:flex;gap:10px;margin-top:12px;
 flex-wrap:wrap;
}
.actions button{padding:9px 13px}
nav{
 position:fixed;bottom:0;left:0;right:0;
 background:#1b102c;
 display:flex;justify-content:space-around;
 padding:15px 5px;
 border-top:1px solid #49216c;
}
nav button{background:transparent;font-size:19px;padding:5px}
.page{display:none}
.page.active{display:block}
.user{font-weight:bold;color:#d7a5ff;margin-bottom:10px}
</style>
</head>

<body>

<header>
<div class="logo">💜 Novagram</div>
<button onclick="showPage('profile')">Profile</button>
</header>

<div class="container">

<section id="home" class="page active">

<h2>Stories</h2>
<div class="stories">
<div class="story"><div class="circle"><div>➕</div></div>Your Story</div>
<div class="story"><div class="circle"><div>😊</div></div>Friends</div>
<div class="story"><div class="circle"><div>🔥</div></div>Trending</div>
<div class="story"><div class="circle"><div>💜</div></div>Novagram</div>
</div>

<div class="card">
<h2>Create Post</h2>
<input id="caption" placeholder="What's on your mind?">
<input type="file" id="media" accept="image/*,video/*">
<button onclick="createPost()">📤 Post Now</button>
<div id="preview"></div>
</div>

<h2>Community Feed</h2>
<div id="feed"></div>

</section>

<section id="reels" class="page">
<h2>🎬 Novagram Reels</h2>
<p>Watch and share your videos.</p>
<div id="reelFeed"></div>
</section>

<section id="create" class="page">
<h2>➕ Create New Post</h2>
<div class="card">
<input id="caption2" placeholder="Write something...">
<input type="file" id="media2" accept="image/*,video/*">
<button onclick="createPost(true)">Publish Post</button>
</div>
</section>

<section id="ai" class="page">
<h2>✨ AI Video Maker</h2>
<div class="card">
<p>Create your own AI video ideas.</p>
<textarea id="aiPrompt" placeholder="Write your video idea..."></textarea>
<button onclick="makeIdea()">Create Idea</button>
<p id="aiResult"></p>
</div>
</section>

<section id="profile" class="page">
<h2>👤 My Profile</h2>
<div class="card">
<h2>💜 Novagram User</h2>
<p>Welcome to my Novagram profile!</p>
<p id="postCount">Posts: 0</p>
</div>
</section>

</div>

<nav>
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('reels')">🎬</button>
<button onclick="showPage('create')">➕</button>
<button onclick="showPage('ai')">✨</button>
<button onclick="showPage('profile')">👤</button>
</nav>

<script>
let posts=[];

function showPage(page){
 document.querySelectorAll('.page').forEach(p=>{
  p.classList.remove('active');
 });
 document.getElementById(page).classList.add('active');
}

function createPost(second=false){
 const caption=document.getElementById(second?'caption2':'caption');
 const media=document.getElementById(second?'media2':'media');
 const file=media.files[0];

 if(!file){
  alert('Please select a photo or video first!');
  return;
 }

 const reader=new FileReader();

 reader.onload=function(e){
  const post={
   caption:caption.value,
   src:e.target.result,
   type:file.type,
   likes:0
  };

  posts.unshift(post);
  renderPosts();
  caption.value='';
  media.value='';
  document.getElementById('preview').innerHTML='';
  showPage('home');
 };

 reader.readAsDataURL(file);
}

document.getElementById('media').addEventListener('change',function(){
 showPreview(this,'preview');
});

document.getElementById('media2').addEventListener('change',function(){
 showPreview(this,'preview');
});

function showPreview(input,target){
 const file=input.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 const el=document.getElementById(target);

 el.innerHTML=file.type.startsWith('video')
 ? `<video class="post-media" controls src="${url}"></video>`
 : `<img class="post-media" src="${url}">`;
}

function renderPosts(){
 const feed=document.getElementById('feed');
 const reels=document.getElementById('reelFeed');

 feed.innerHTML='';
 reels.innerHTML='';

 posts.forEach((post,index)=>{
  const media=post.type.startsWith('video')
  ? `<video class="post-media" controls src="${post.src}"></video>`
  : `<img class="post-media" src="${post.src}">`;

  const html=`
  <div class="card">
   <div class="user">💜 Novagram User</div>
   <p>${escapeText(post.caption)}</p>
   ${media}
   <div class="actions">
    <button onclick="likePost(${index})">❤️ ${post.likes}</button>
    <button onclick="commentPost(${index})">💬 Comment</button>
    <button onclick="followUser()">➕ Follow</button>
   </div>
  </div>`;

  feed.innerHTML+=html;

  if(post.type.startsWith('video')){
   reels.innerHTML+=html;
  }
 });

 document.getElementById('postCount').innerText='Posts: '+posts.length;
}

function escapeText(value){
 const div=document.createElement('div');
 div.textContent=value;
 return div.innerHTML;
}

function likePost(index){
 posts[index].likes++;
 renderPosts();
}

function commentPost(index){
 const comment=prompt('Write your comment:');
 if(comment){
  alert('Comment added: '+comment);
 }
}

function followUser(){
 alert('You are following this user!');
}

function makeIdea(){
 const promptText=document.getElementById('aiPrompt').value;
 if(!promptText.trim()){
  alert('Please write your video idea!');
  return;
 }
 document.getElementById('aiResult').innerText=
 'Your video idea: '+promptText+
 '\n\nAI video generation will be connected in a future version.';
}
</script>

</body>
</html>
