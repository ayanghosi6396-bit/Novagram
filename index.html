
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novagram 💜</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0ff;color:#291344;font-family:Arial}
header{background:linear-gradient(120deg,#4c1d95,#9333ea);color:white;padding:17px;text-align:center;position:sticky;top:0;z-index:5}
header h2{margin:0}
main{max-width:600px;margin:auto;padding:12px;padding-bottom:85px}
.card{background:white;padding:15px;border-radius:16px;margin:13px 0;box-shadow:0 3px 12px #ddd}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:12px;background:#7026bb;color:white;font-weight:bold;cursor:pointer}
.full{width:100%;margin:5px 0}
.secondary{background:#eee;color:#542080}
.hidden{display:none!important}
.post img,.post video{width:100%;max-height:500px;object-fit:contain;border-radius:12px;margin-top:10px;background:#eee}
.post-actions{display:flex;gap:7px;margin-top:10px}
.post-actions button{flex:1;padding:10px 3px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 3px;box-shadow:0 -2px 12px #ddd;z-index:10}
nav button{background:transparent;color:#7026bb;font-size:19px;padding:8px}
.small{font-size:12px;color:#777}
#status{font-size:13px;color:#7026bb}
.avatar{width:65px;height:65px;border-radius:50%;object-fit:cover;background:#eee}
</style>
</head>
<body>

<header>
<h2>💜 Novagram</h2>
<p>Connect • Share • Discover</p>
</header>

<main>

<section class="card" id="auth">
<h3>Welcome to Novagram 💜</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="full" onclick="signup()">Create Account</button>
<button class="full secondary" onclick="login()">Login</button>
<p id="authStatus"></p>
</section>

<section id="app" class="hidden">

<div class="card">
<h3 id="welcome">💜 Welcome</h3>
<button class="secondary" onclick="logout()">Logout</button>
</div>

<section id="home">
<div class="card">
<h3>➕ Create Post / Reel</h3>
<textarea id="caption" placeholder="What's on your mind?"></textarea>
<label><b>📸 Gallery से फोटो या वीडियो चुनें</b></label>
<input id="media" type="file" accept="image/*,video/*">
<p class="small">फोटो या वीडियो चुनकर Publish करें (अधिकतम 50 MB)।</p>
<button class="full" onclick="publish()">📤 Publish</button>
<p id="uploadStatus"></p>
</div>

<h3>💜 Feed</h3>
<div id="feed">Loading...</div>
</section>

<section id="profile" class="hidden">
<div class="card">
<h3>👤 Your Profile</h3>
<img id="avatar" class="avatar" alt="Profile">
<input id="fullName" placeholder="Your Name">
<input id="username" placeholder="Username">
<textarea id="bio" placeholder="Your Bio"></textarea>
<button class="full" onclick="saveProfile()">Save Profile</button>
<p id="profileStatus"></p>
</div>
</section>

</section>
</main>

<nav id="nav" class="hidden">
<button onclick="showTab('home')">🏠</button>
<button onclick="showTab('home')">🔍</button>
<button onclick="showTab('home');document.getElementById('caption').focus()">➕</button>
<button onclick="showTab('home')">❤️</button>
<button onclick="showTab('profile')">👤</button>
</nav>

<script>
const SUPABASE_URL="https://gxnjbozxxjkfufxpiiiq.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ptKLjPeypXVEmehGDTl_cQ_6ajAxQAV";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null;

const el=id=>document.getElementById(id);
function message(id,text){el(id).textContent=text;}

async function signup(){
 const email=el('email').value.trim();
 const password=el('password').value;
 if(!email||password.length<6){message('authStatus','सही Email और कम से कम 6 अक्षर का Password डालो।');return;}
 const {data,error}=await db.auth.signUp({email,password});
 if(error){message('authStatus',error.message);return;}
 message('authStatus','Account बन गया! Email verification माँगी जाए तो Email verify करो।');
 if(data.session)await startApp();
}

async function login(){
 const email=el('email').value.trim();
 const password=el('password').value;
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){message('authStatus',error.message);return;}
 await startApp();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function startApp(){
 const {data,error}=await db.auth.getUser();
 if(error||!data.user)return;
 currentUser=data.user;
 el('auth').classList.add('hidden');
 el('app').classList.remove('hidden');
 el('nav').classList.remove('hidden');
 el('welcome').textContent='💜 '+(currentUser.email||'Novagram User');
 await loadProfile();
 await loadFeed();
}

function showTab(tab){
 el('home').classList.toggle('hidden',tab!=='home');
 el('profile').classList.toggle('hidden',tab!=='profile');
 if(tab==='home')loadFeed();
}

async function loadProfile(){
 const {data}=await db.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
 if(data){
  el('fullName').value=data.full_name||'';
  el('username').value=data.username||'';
  el('bio').value=data.bio||'';
  if(data.avatar_url)el('avatar').src=data.avatar_url;
 }
}

async function saveProfile(){
 const {error}=await db.from('profiles').upsert({
  id:currentUser.id,
  full_name:el('fullName').value.trim(),
  username:el('username').value.trim()||null,
  bio:el('bio').value.trim()
 });
 message('profileStatus',error?error.message:'Profile saved 💜');
}

async function publish(){
 const file=el('media').files[0];
 const caption=el('caption').value.trim();
 const status=el('uploadStatus');

 if(!file&&!caption){status.textContent='पहले Text या Photo/Video चुनो।';return;}
 if(file&&file.size>50*1024*1024){status.textContent='फाइल 50 MB से बड़ी है।';return;}

 let url=null,type='text';
 if(file){
  if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){
   status.textContent='सिर्फ फोटो या वीडियो चुनो।';return;
  }
  type=file.type.startsWith('video/')?'reel':'image';
  const path=currentUser.id+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  status.textContent='Uploading...';
  const {error}=await db.storage.from('Novagram_media').upload(path,file);
  if(error){status.textContent=error.message;return;}
  url=db.storage.from('Novagram_media').getPublicUrl(path).data.publicUrl;
 }

 const {error}=await db.from('posts').insert({
  user_id:currentUser.id,
  caption:caption,
  media_url:url,
  media_type:type
 });
 if(error){status.textContent=error.message;return;}

 el('caption').value='';
 el('media').value='';
 status.textContent='Post Published 💜';
 await loadFeed();
}

async function loadFeed(){
 const feed=el('feed');
 feed.textContent='Loading...';
 const {data:posts,error}=await db.from('posts').select('*').order('created_at',{ascending:false});
 if(error){feed.textContent=error.message;return;}
 feed.innerHTML='';
 if(!posts.length){feed.textContent='अभी कोई पोस्ट नहीं है। पहली पोस्ट तुम करो!';return;}

 for(const p of posts){
  const card=document.createElement('div');
  card.className='card post';

  const title=document.createElement('b');
  title.textContent='💜 Novagram User';
  card.appendChild(title);

  const caption=document.createElement('p');
  caption.textContent=p.caption||'';
  card.appendChild(caption);

  if(p.media_url){
   const media=document.createElement(p.media_type==='image'?'img':'video');
   media.src=p.media_url;
   if(media.tagName==='VIDEO')media.controls=true;
   card.appendChild(media);
  }

  const date=document.createElement('p');
  date.className='small';
  date.textContent=new Date(p.created_at).toLocaleString();
  card.appendChild(date);

  const actions=document.createElement('div');
  actions.className='post-actions';

  const like=document.createElement('button');
  like.textContent='❤️ Like';
  like.onclick=()=>likePost(p.id);

  const comment=document.createElement('button');
  comment.textContent='💬 Comment';
  comment.onclick=()=>commentPost(p.id);

  const share=document.createElement('button');
  share.textContent='📤 Share';
  share.onclick=()=>sharePost(p);

  actions.append(like,comment,share);
  card.appendChild(actions);

  const comments=document.createElement('div');
  comments.className='small';
  comments.textContent='Comments loading...';
  card.appendChild(comments);
  loadComments(p.id,comments);

  feed.appendChild(card);
 }
}

async function likePost(id){
 const {data:existing,error:checkError}=await db.from('likes').select('id').eq('post_id',id).eq('user_id',currentUser.id).maybeSingle();
 if(checkError){alert(checkError.message);return;}
 let result;
 if(existing){
  result=await db.from('likes').delete().eq('id',existing.id);
 }else{
  result=await db.from('likes').insert({post_id:id,user_id:currentUser.id});
 }
 if(result.error)alert(result.error.message);
 else loadFeed();
}

async function commentPost(id){
 const value=prompt('अपना Comment लिखो');
 if(!value||!value.trim())return;
 const {error}=await db.from('comments').insert({
  post_id:id,user_id:currentUser.id,comment:value.trim()
 });
 if(error)alert(error.message);
 else loadFeed();
}

async function loadComments(id,container){
 const {data,error}=await db.from('comments').select('comment').eq('post_id',id).order('created_at');
 if(error){container.textContent='Comments unavailable';return;}
 container.textContent=data.length?data.map(x=>'💬 '+x.comment).join(' | '):'No comments yet';
}

async function sharePost(post){
 const url=post.media_url||location.href;
 if(navigator.share){
  try{await navigator.share({title:'Novagram 💜',text:post.caption||'Novagram Post',url});}catch(e){}
 }else{
  try{await navigator.clipboard.writeText(url);alert('Link copied!');}
  catch(e){alert(url);}
 }
}

db.auth.onAuthStateChange((event,session)=>{
 if(session&&!currentUser)setTimeout(startApp,0);
});
startApp();
</script>
</body>
</html>
