
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novagram 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0ff;font-family:Arial;color:#24143b}
header{background:linear-gradient(120deg,#4c1d95,#9333ea);color:white;padding:20px;text-align:center}
main{max-width:650px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:15px;box-shadow:0 3px 12px #0001}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
textarea{min-height:75px}
button{padding:11px 16px;background:#7025c9;color:white;border:0;border-radius:9px;font-weight:bold;margin:4px;cursor:pointer}
.secondary{background:#eee5ff;color:#54208c}
.hidden{display:none}
.post{border-bottom:1px solid #eee;padding:12px 0}
.post img.post-photo{width:100%;max-height:400px;object-fit:contain}
.status{font-size:13px;color:#7025c9}
.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#eadcff;vertical-align:middle;margin-right:10px}
.post-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}
.preview{width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:10px 0}
.stats{display:flex;gap:20px;margin:12px 0;color:#54208c;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>💜 Novagram</h1>
Connect • Share • Discover
</header>
<main>

<section id="auth" class="card">
<h2>Welcome to Novagram</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="signup">Sign Up</button>
<button id="login" class="secondary">Login</button>
<p id="authMsg" class="status"></p>
</section>

<div id="appArea" class="hidden">
<section class="card">
<h2>Your Profile</h2>
<img id="avatarPreview" class="preview" alt="Profile photo">
<input id="profilePhoto" type="file" accept="image/*">
<input id="name" placeholder="Your Name">
<input id="username" placeholder="Username">
<textarea id="bio" placeholder="Write your Bio"></textarea>
<div class="stats">
<span id="followerCount">0 Followers</span>
<span id="followingCount">0 Following</span>
</div>
<button id="saveProfile">Save Profile</button>
<button id="logout" class="secondary">Logout</button>
<p id="profileMsg" class="status"></p>
</section>

<section class="card">
<h2>Create Post</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<input id="photo" type="file" accept="image/*">
<button id="publish">Publish Post</button>
<p id="postMsg" class="status"></p>
</section>

<section class="card">
<h2>💜 Novagram Feed</h2>
<div id="feed">Loading posts...</div>
</section>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore,doc,setDoc,getDoc,addDoc,
collection,query,orderBy,onSnapshot,
serverTimestamp,deleteDoc,getDocs,where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCC5J21io0PaOrOhVeoR9L92ostWLKI4GE",
authDomain:"novagram-68bd9.firebaseapp.com",
projectId:"novagram-68bd9",
storageBucket:"novagram-68bd9.firebasestorage.app",
messagingSenderId:"712062216370",
appId:"1:712062216370:web:c8325500a538873af8c1ab"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let user=null;
let profile={
name:"Novagram User",
username:"user",
bio:"",
avatarURL:""
};
let stopFeed=null;

function msg(id,text){
$(id).textContent=text;
}

function safe(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function error(e){
return e.code==="auth/email-already-in-use"?"Email already registered":
e.code==="auth/invalid-credential"?"Email or password incorrect":
e.message;
}

function compressImage(file,maxWidth=600){
return new Promise((resolve,reject)=>{
if(!file || !file.type.startsWith("image/")){
reject(new Error("Please select an image."));
return;
}
const reader=new FileReader();
reader.onerror=()=>reject(new Error("Image could not be read."));
reader.onload=()=>{
const img=new Image();
img.onerror=()=>reject(new Error("Invalid image."));
img.onload=()=>{
const scale=Math.min(1,maxWidth/img.width);
const canvas=document.createElement("canvas");
canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);
const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,canvas.width,canvas.height);
const result=canvas.toDataURL("image/jpeg",0.5);
if(result.length>650000){
reject(new Error("Image is too large. Please choose a smaller photo."));
}else{
resolve(result);
}
};
img.src=reader.result;
};
reader.readAsDataURL(file);
});
}

$("signup").onclick=async()=>{
try{
await createUserWithEmailAndPassword(
auth,$("email").value.trim(),$("password").value
);
msg("authMsg","Account created!");
}catch(e){msg("authMsg",error(e))}
};

$("login").onclick=async()=>{
try{
await signInWithEmailAndPassword(
auth,$("email").value.trim(),$("password").value
);
msg("authMsg","Login successful!");
}catch(e){msg("authMsg",error(e))}
};

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
user=u;
$("auth").classList.toggle("hidden",!!u);
$("appArea").classList.toggle("hidden",!u);

if(!u){
if(stopFeed)stopFeed();
return;
}

try{
await loadProfile();
await updateStats();
startFeed();
}catch(e){
msg("profileMsg",error(e));
}
});

async function loadProfile(){
const s=await getDoc(doc(db,"Users",user.uid));

if(s.exists()){
profile={...profile,...s.data()};
}else{
await setDoc(doc(db,"Users",user.uid),profile);
}

$("name").value=profile.name||"";
$("username").value=profile.username||"";
$("bio").value=profile.bio||"";
$("avatarPreview").src=profile.avatarURL||"";
}

$("profilePhoto").onchange=()=>{
const file=$("profilePhoto").files[0];
if(file){
$("avatarPreview").src=URL.createObjectURL(file);
}
};

$("saveProfile").onclick=async()=>{
try{
let avatarURL=profile.avatarURL||"";
const file=$("profilePhoto").files[0];

if(file){
avatarURL=await compressImage(file,300);
}

profile={
name:$("name").value.trim(),
username:$("username").value.trim(),
bio:$("bio").value.trim(),
avatarURL
};

await setDoc(doc(db,"Users",user.uid),profile,{merge:true});
$("avatarPreview").src=avatarURL||"";
$("profilePhoto").value="";
msg("profileMsg","Profile saved 💜");
}catch(e){
msg("profileMsg",error(e));
}
};

async function updateStats(){
try{
const followers=await getDocs(query(
collection(db,"Follows"),
where("followingUid","==",user.uid)
));
const following=await getDocs(query(
collection(db,"Follows"),
where("followerUid","==",user.uid)
));
$("followerCount").textContent=followers.size+" Followers";
$("followingCount").textContent=following.size+" Following";
}catch(e){
$("followerCount").textContent="Followers unavailable";
$("followingCount").textContent="Following unavailable";
}
}

$("publish").onclick=async()=>{
const text=$("postText").value.trim();
const file=$("photo").files[0];

if(!text&&!file){
msg("postMsg","Write something or select a photo.");
return;
}

try{
let imageUrl="";
if(file){
imageUrl=await compressImage(file,600);
}

await addDoc(collection(db,"Posts"),{
uid:user.uid,
name:profile.name||"Novagram User",
username:profile.username||"user",
avatarURL:profile.avatarURL||"",
text,
imageUrl,
createdAt:serverTimestamp()
});

$("postText").value="";
$("photo").value="";
msg("postMsg","Post published! 💜");
}catch(e){
msg("postMsg",error(e));
}
};

function startFeed(){
if(stopFeed)stopFeed();

stopFeed=onSnapshot(
query(collection(db,"Posts"),orderBy("createdAt","desc")),
s=>{
$("feed").innerHTML="";

if(s.empty){
$("feed").textContent="No posts yet. Welcome to Novagram!";
return;
}

s.forEach(p=>{
const d=p.data();
const id=p.id;
const el=document.createElement("div");
el.className="post";

el.innerHTML=`
<div>
<img class="post-avatar" src="${safe(d.avatarURL||"")}" alt="">
<b>💜 ${safe(d.name||"Novagram User")}</b>
</div>
<p>@${safe(d.username||"user")}</p>
<p>${safe(d.text||"")}</p>
${d.imageUrl?`<img class="post-photo" src="${safe(d.imageUrl)}" alt="Post photo">`:""}
<div class="post-actions">
<button class="secondary like">🤍 Like</button>
<span class="likes">Loading...</span>
<button class="secondary toggle">💬 Comments</button>
</div>
<div class="followArea"></div>
<div class="comments hidden">
<div class="commentList"></div>
<input class="commentText" placeholder="Write a comment...">
<button class="send">Send</button>
</div>
`;

$("feed").appendChild(el);

const likeRef=doc(db,"Posts",id,"Likes",user.uid);
const likes=collection(db,"Posts",id,"Likes");

async function refresh(){
try{
const [mine,all]=await Promise.all([
getDoc(likeRef),getDocs(likes)
]);
el.querySelector(".like").textContent=
mine.exists()?"💜 Liked":"🤍 Like";
el.querySelector(".likes").textContent=" "+all.size+" Likes";
}catch(e){
el.querySelector(".likes").textContent="Likes unavailable";
}
}

el.querySelector(".like").onclick=async()=>{
try{
const mine=await getDoc(likeRef);
if(mine.exists()){
await deleteDoc(likeRef);
}else{
await setDoc(likeRef,{uid:user.uid});
}
await refresh();
}catch(e){alert(error(e))}
};

refresh();

if(d.uid && d.uid!==user.uid){
const followArea=el.querySelector(".followArea");
const followId=d.uid+"_"+user.uid;
const followRef=doc(db,"Follows",followId);

const followButton=document.createElement("button");
followButton.className="secondary";
followButton.textContent="Loading Follow...";
followArea.appendChild(followButton);

async function checkFollow(){
try{
const f=await getDoc(followRef);
followButton.textContent=f.exists()?"Following ✓":"➕ Follow";
}catch(e){
followButton.textContent="Follow unavailable";
}
}

followButton.onclick=async()=>{
try{
followButton.disabled=true;
const f=await getDoc(followRef);
if(f.exists()){
await deleteDoc(followRef);
}else{
await setDoc(followRef,{
followerUid:user.uid,
followingUid:d.uid,
createdAt:serverTimestamp()
});
}
await checkFollow();
await updateStats();
}catch(e){
alert(error(e));
}finally{
followButton.disabled=false;
}
};
checkFollow();
}

const box=el.querySelector(".comments");
const list=el.querySelector(".commentList");

async function loadComments(){
try{
const cs=await getDocs(query(
collection(db,"Posts",id,"Comments"),
orderBy("createdAt","asc")
));
list.innerHTML="";
cs.forEach(c=>{
const x=document.createElement("p");
x.innerHTML="<b>"+safe(c.data().name)+"</b>: "+safe(c.data().text);
list.appendChild(x);
});
}catch(e){
list.textContent="Comments unavailable";
}
}

el.querySelector(".toggle").onclick=()=>{
box.classList.toggle("hidden");
loadComments();
};

el.querySelector(".send").onclick=async()=>{
const input=el.querySelector(".commentText");
const t=input.value.trim();
if(!t)return;

try{
await addDoc(collection(db,"Posts",id,"Comments"),{
uid:user.uid,
name:profile.name||"User",
text:t,
createdAt:serverTimestamp()
});
input.value="";
loadComments();
}catch(e){alert(error(e))}
};
});
},
e=>{$("feed").textContent=error(e)}
);
}
</script>
</body>
</html>
