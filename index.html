
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novagram 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0ff;color:#291344;font-family:Arial}
header{background:linear-gradient(120deg,#4c1d95,#9333ea);color:white;padding:20px;text-align:center}
h1{margin:0}
nav{display:flex;justify-content:space-around;background:white;padding:13px;position:sticky;top:0}
button{background:#7e22ce;color:white;border:0;border-radius:9px;padding:12px;margin:4px;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #d8c5ee;border-radius:9px;font-size:15px}
main{max-width:600px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #ddd}
.hidden{display:none}
.muted{color:#806b94;font-size:13px}
.post{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>💜 Novagram</h1>
<p>Connect • Share • Discover</p>
</header>

<section id="auth" class="card" style="max-width:500px;margin:20px auto">
<h2>Novagram में आपका स्वागत है</h2>
<input id="email" type="email" placeholder="ईमेल">
<input id="password" type="password" placeholder="पासवर्ड">
<button onclick="signup()">नया अकाउंट बनाओ</button>
<button onclick="login()">लॉगिन करो</button>
<p id="message"></p>
</section>

<div id="app" class="hidden">
<nav>
<button onclick="showPage('feed')">🏠 होम</button>
<button onclick="showPage('create')">➕ पोस्ट</button>
<button onclick="showPage('profile')">👤 प्रोफाइल</button>
</nav>

<main>
<section id="feed">
<h2>होम फीड 💜</h2>
<div id="posts"></div>
</section>

<section id="create" class="hidden">
<div class="card">
<h2>नई पोस्ट बनाओ</h2>
<textarea id="postText" rows="5" placeholder="क्या चल रहा है?"></textarea>
<button onclick="publish()">पोस्ट पब्लिश करो</button>
<p id="postMessage"></p>
</div>
</section>

<section id="profile" class="hidden">
<div class="card">
<h2>तुम्हारी प्रोफाइल</h2>
<input id="name" placeholder="तुम्हारा नाम">
<input id="username" placeholder="यूजरनेम">
<textarea id="bio" placeholder="अपना बायो लिखो"></textarea>
<button onclick="saveProfile()">प्रोफाइल सेव करो</button>
<p id="profileMessage"></p>
<hr>
<p id="profileEmail"></p>
<button onclick="logout()">लॉगआउट</button>
</div>
</section>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyCC5J21io0PaOrOhVeoR9L92ostWLKI4GE",
 authDomain: "novagram-68bd9.firebaseapp.com",
 projectId: "novagram-68bd9",
 storageBucket: "novagram-68bd9.firebasestorage.app",
 messagingSenderId: "712062216370",
 appId: "1:712062216370:web:c8325500a538873af8c1ab",
 measurementId: "G-WV2MCHK3HS"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

function showPage(page){
 ['feed','create','profile'].forEach(id=>{
 document.getElementById(id).classList.toggle('hidden',id!==page);
 });
 if(page==='feed') loadPosts();
}

function showError(error,element){
 document.getElementById(element).textContent =
 error.message || String(error);
}

async function signup(){
 try{
 const user=await auth.createUserWithEmailAndPassword(
 email.value.trim(),password.value
 );
 await db.collection('Users').doc(user.user.uid).set({
 name:'Novagram User',
 username:'user'+user.user.uid.slice(0,6),
 bio:'💜 Welcome to Novagram',
 createdAt:firebase.firestore.FieldValue.serverTimestamp()
 });
 }catch(e){showError(e,'message')}
}

async function login(){
 try{
 await auth.signInWithEmailAndPassword(
 email.value.trim(),password.value
 );
 }catch(e){showError(e,'message')}
}

auth.onAuthStateChanged(async user=>{
 currentUser=user;
 authSection(user);
 if(user){
 document.getElementById('app').classList.remove('hidden');
 document.getElementById('profileEmail').textContent=user.email;
 await loadProfile();
 await loadPosts();
 }else{
 document.getElementById('app').classList.add('hidden');
 }
});

function authSection(user){
 document.getElementById('auth').classList.toggle('hidden',!!user);
}

async function loadProfile(){
 if(!currentUser)return;
 try{
 const doc=await db.collection('Users').doc(currentUser.uid).get();
 if(doc.exists){
 const d=doc.data();
 name.value=d.name||'';
 username.value=d.username||'';
 bio.value=d.bio||'';
 }
 }catch(e){console.log(e)}
}

async function saveProfile(){
 try{
 await db.collection('Users').doc(currentUser.uid).set({
 name:name.value.trim(),
 username:username.value.trim(),
 bio:bio.value.trim()
 },{merge:true});
 profileMessage.textContent='💜 प्रोफाइल सेव हो गई!';
 }catch(e){showError(e,'profileMessage')}
}

async function publish(){
 const text=document.getElementById('postText').value.trim();
 if(!text){
 postMessage.textContent='पहले कुछ लिखो!';
 return;
 }
 try{
 await db.collection('Posts').add({
 uid:currentUser.uid,
 email:currentUser.email,
 text:text,
 createdAt:firebase.firestore.FieldValue.serverTimestamp()
 });
 postText.value='';
 postMessage.textContent='पोस्ट पब्लिश हो गई! 💜';
 showPage('feed');
 }catch(e){showError(e,'postMessage')}
}

async function loadPosts(){
 const area=document.getElementById('posts');
 area.innerHTML='<p>पोस्ट लोड हो रही हैं...</p>';
 try{
 const snap=await db.collection('Posts')
 .orderBy('createdAt','desc').limit(40).get();
 area.innerHTML='';
 if(snap.empty){
 area.innerHTML='<div class="card">अभी कोई पोस्ट नहीं है। पहली पोस्ट तुम करो! 💜</div>';
 return;
 }
 snap.forEach(doc=>{
 const p=doc.data();
 const card=document.createElement('div');
 card.className='card';
 const heading=document.createElement('b');
 heading.textContent=p.email||'Novagram User';
 const content=document.createElement('p');
 content.className='post';
 content.textContent=p.text||'';
 const date=document.createElement('p');
 date.className='muted';
 date.textContent=p.createdAt?.toDate().toLocaleString('hi-IN')||'नई पोस्ट';
 card.append(heading,content,date);
 area.appendChild(card);
 });
 }catch(e){
 area.textContent='पोस्ट लोड नहीं हुई: '+e.message;
 }
}

async function logout(){
 await auth.signOut();
}
</script>
</body>
</html>
